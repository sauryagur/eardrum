[project]
name = "eardrum"
version = "0.2.0"
description = "Dual-head polyphonic piano transcription (onsets & frames)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "gradio>=4.44",
    "librosa>=0.10",
    "matplotlib>=3.8",
    "mir-eval>=0.8.2",
    "numpy>=1.24",
    "pretty_midi>=0.2.10",
    "requests>=2.31",
    "scipy>=1.10",
    "soundfile>=0.12",
    "torch>=2.6",
    "wandb>=0.17",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
include = ["eardrum*"]
